[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "airmass-gui"
version = "0.1.0"
description = "GUI for creating airmass (X) charts of astronomical targets from an observatory"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "astropy>=5.3",
    "matplotlib>=3.7",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest", "dukpy"]

[project.scripts]
airmass-gui = "airmass_gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
